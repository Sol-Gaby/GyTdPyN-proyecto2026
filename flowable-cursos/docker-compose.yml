name: flowable-cursos-v1

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowable}
      POSTGRES_USER: ${POSTGRES_USER:-flowable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  preparar-institucion:
    image: postgres:15
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:-flowable}
      PGUSER: ${POSTGRES_USER:-flowable}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - ./sql:/sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/sql/01-estructura.sql", "-f", "/sql/02-datos-demostracion.sql"]

  flowable:
    build:
      context: ../proyectoGestion2026
      dockerfile: ../flowable-cursos/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      preparar-institucion:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-flowable}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowable}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      CURSOS_INSTITUCION_JDBC_URL: jdbc:postgresql://database:5432/institucion_cursos
      FLOWABLE_HISTORY_LEVEL: audit
      FLOWABLE_CHECK_PROCESS_DEFINITIONS: "false"
      FLOWABLE_FORM_DEPLOY_RESOURCES: "false"
      FLOWABLE_ASYNC_EXECUTOR_ACTIVATE: "true"
      CURSOS_PERSONAL_PASSWORD: ${CURSOS_PERSONAL_PASSWORD:?Definí CURSOS_PERSONAL_PASSWORD en .env}
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  postgres_data:
