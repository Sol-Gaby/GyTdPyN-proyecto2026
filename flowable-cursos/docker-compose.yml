name: flowable-cursos-v1

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  flowable:
    build:
      context: ../proyectoGestion2026
      dockerfile: ../flowable-cursos/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FLOWABLE_HISTORY_LEVEL: audit
      FLOWABLE_CHECK_PROCESS_DEFINITIONS: "false"
      FLOWABLE_ASYNC_EXECUTOR_ACTIVATE: "true"
      CURSOS_PERSONAL_PASSWORD: ${CURSOS_PERSONAL_PASSWORD}
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  postgres_data:
