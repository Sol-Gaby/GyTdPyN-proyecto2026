<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Portal de Capacitaciones</title>
        <link rel="stylesheet" href="estilos.css"
        ><script src="app.js" defer></script>
    </head>
    <body>
        <header>
            <strong>Institución de Capacitación</strong>
            <nav><a href="#Solicitud">Solicitar curso</a><a href="#Acceso">Ingresar</a></nav>
        </header>
        <main>
            <section id="Solicitud">
                <h1>Solicitud de Capacitación</h1>
                <form id="registro">
                    <label>Código de empresa<input name="empresaCodigo" required pattern="[A-Z0-9][A-Z0-9\-]{0,49}" placeholder="EMP-RC"></label>
                    <label>Nombre de su empresa<input name="empresaNombre" required maxlength="150"></label>
                    <label>Persona de contacto<input name="contacto" required maxlength="150"></label>
                    <label>Correo electrónico<input name="email" type="email" required maxlength="150"></label>
                    <label>Teléfono de contacto<input name="telefono" type="tel" required maxlength="50"></label>
                    <label>Temática del Curso<input name="cursoNombre" required maxlength="150"></label>
                    <label>Cantidad de participantes estimados<input name="participantesEstimados" type="number" min="1" max="5000" required></label>
                    <label>Fecha estimada de inicio del curso<input name="fechasPreferidas" required maxlength="400"></label>
                    <label class="ancho">Descripción<textarea name="cursoDescripcion" required maxlength="2000"></textarea></label>
                    <button id="boton_enviar">Enviar solicitud</button>
                </form>
                <p id="Registro de Estados" role="status"></p>
            </section>

            <section id="Acceso"><h2>Acceso al portal</h2>
                <form id="login">
                    <label>Usuario<input name="usuario" autocomplete="username" required></label>
                    <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
                    <button>Ingresar</button></form>
                <p id="acceso-estado" role="status"></p>
                <div id="privado" hidden>
                    <div class="acciones">
                        <button id="actualizar">Actualizar</button>
                        <button id="salir">Cerrar sesión</button>
                    </div>
                    <div id="contenido">
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
